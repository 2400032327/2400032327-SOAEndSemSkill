spring.application.name=tourist-record-token-validation
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tourist_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Use this same value in the Swagger request header X-API-TOKEN.
app.security.token=HOTEL-TOURIST-2026
